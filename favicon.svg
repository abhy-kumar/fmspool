<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer 8-ball body -->
  <rect x="10" y="2" width="12" height="2" fill="#16131f"/>
  <rect x="6" y="4" width="20" height="2" fill="#16131f"/>
  <rect x="4" y="6" width="24" height="2" fill="#16131f"/>
  <rect x="2" y="8" width="28" height="4" fill="#16131f"/>
  <rect x="2" y="12" width="28" height="8" fill="#0d0b12"/>
  <rect x="2" y="20" width="28" height="4" fill="#0d0b12"/>
  <rect x="4" y="24" width="24" height="2" fill="#0d0b12"/>
  <rect x="6" y="26" width="20" height="2" fill="#0d0b12"/>
  <rect x="10" y="28" width="12" height="2" fill="#0d0b12"/>
  
  <!-- Specular highlight -->
  <rect x="6" y="6" width="4" height="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="10" y="6" width="2" height="2" fill="#ffffff" fill-opacity="0.5"/>

  <!-- Center White Disc -->
  <rect x="12" y="10" width="8" height="2" fill="#f4f1ff"/>
  <rect x="10" y="12" width="12" height="8" fill="#f4f1ff"/>
  <rect x="12" y="20" width="8" height="2" fill="#f4f1ff"/>

  <!-- Pixel '8' inside disc -->
  <rect x="13" y="12" width="6" height="2" fill="#0d0b12"/>
  <rect x="13" y="15" width="6" height="2" fill="#0d0b12"/>
  <rect x="13" y="18" width="6" height="2" fill="#0d0b12"/>
  <rect x="13" y="13" width="2" height="3" fill="#0d0b12"/>
  <rect x="17" y="13" width="2" height="3" fill="#0d0b12"/>
  <rect x="13" y="16" width="2" height="3" fill="#0d0b12"/>
  <rect x="17" y="16" width="2" height="3" fill="#0d0b12"/>
</svg>
